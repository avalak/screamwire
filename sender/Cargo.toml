[package]
name = "screamwire"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "screamwire-sender"
path = "src/main.rs"

[dependencies]
screamwire-common = { path = "../common" }

clap = { version = "4.6", features = ["derive"] }
pipewire = { version = "0.10", features = ["v0_3_44"] }
ringbuf = "0.5"
toml = "1.1"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
nix = { version = "0.31.3", features = ["event"] }
env_logger = "0.11"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "extract_benchmark"
harness = false

[[bench]]
name = "vad_benchmark"
harness = false

[[bench]]
name = "scanner_benchmark"
harness = false
