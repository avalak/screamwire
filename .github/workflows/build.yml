name: Build sender (x86_64, armhf)

on:
  push:
    branches: [main, master]
    paths:
      - 'sender/**'
      - 'common/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile.armhf'
      - 'Cross.toml'
  pull_request:
    branches: [main, master]
    paths:
      - 'sender/**'
      - 'common/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile.armhf'
      - 'Cross.toml'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build sender (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: false
            artifact: screamwire-sender-amd64
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            use-cross: true
            artifact: screamwire-sender-armhf

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Configure Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install native dependencies
        if: matrix.use-cross == false
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev clang pkg-config

      - name: Install cross
        if: matrix.use-cross == true
        run: cargo install cross --locked

      - name: Build (native)
        if: matrix.use-cross == false
        run: cargo build --release --bin screamwire-sender --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use-cross == true
        run: cross build --release --bin screamwire-sender --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/screamwire-sender
          if-no-files-found: error
